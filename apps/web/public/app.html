<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Explain Your Data</title><meta name="description" content="Upload any data and get cleaning, statistics, charts, plain-language explanations and reports."><meta name="eyd-api" content="/api">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}
/* Layout concept: an analyst's bench — quiet instrument chrome (ink, petrol accent, hairlines) so the data supplies the colour; sidebar workflow on the left, one working surface on the right. */
:root {
  --bg: #f3f5f4; --surface: #ffffff; --surface-2: #eef2f0; --surface-3: #e3e9e6;
  --ink: #0f1614; --ink-2: #44514d; --muted: #6f7c78; --line: #d9e0dd; --line-2: #c5cfcb;
  --accent: #0b6e69; --accent-2: #09807a; --accent-soft: #daeeeb; --accent-ink: #ffffff;
  --good: #1b7f3a; --good-soft: #e0f1e5; --warn: #9a6200; --warn-soft: #fbefd6; --crit: #b83a30; --crit-soft: #f8e1de;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948; --s-other: #9aa4a0;
  --grid: #e4e9e7; --axis: #c3ccc8;
  --seq-1: #cde2fb; --seq-2: #86b6ef; --seq-3: #3987e5; --seq-4: #1c5cab; --seq-5: #0d366b;
  --div-neg2: #c8423f; --div-neg1: #eda39d; --div-mid: #e3e6e4; --div-pos1: #86b6ef; --div-pos2: #256abf;
  --shadow: 0 1px 2px rgba(15, 22, 20, .06), 0 8px 24px -12px rgba(15, 22, 20, .18);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 10px; --r-sm: 7px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b100f; --surface: #121917; --surface-2: #19221f; --surface-3: #212b28;
    --ink: #e5ece9; --ink-2: #a6b3ae; --muted: #74837e; --line: #25302d; --line-2: #33403c;
    --accent: #36bfb4; --accent-2: #5ad2c8; --accent-soft: #12302d; --accent-ink: #032220;
    --good: #3fbf62; --good-soft: #14301d; --warn: #e3a52c; --warn-soft: #33270d; --crit: #ef6f63; --crit-soft: #3a1a17;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767; --s-other: #5e6966;
    --grid: #222c29; --axis: #34413d;
    --seq-1: #102c52; --seq-2: #1c5cab; --seq-3: #3987e5; --seq-4: #6da7ec; --seq-5: #b7d3f6;
    --div-neg2: #e66767; --div-neg1: #8a3d3a; --div-mid: #383d3b; --div-pos1: #1c5cab; --div-pos2: #6da7ec;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px -12px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b100f; --surface: #121917; --surface-2: #19221f; --surface-3: #212b28;
  --ink: #e5ece9; --ink-2: #a6b3ae; --muted: #74837e; --line: #25302d; --line-2: #33403c;
  --accent: #36bfb4; --accent-2: #5ad2c8; --accent-soft: #12302d; --accent-ink: #032220;
  --good: #3fbf62; --good-soft: #14301d; --warn: #e3a52c; --warn-soft: #33270d; --crit: #ef6f63; --crit-soft: #3a1a17;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767; --s-other: #5e6966;
  --grid: #222c29; --axis: #34413d;
  --seq-1: #102c52; --seq-2: #1c5cab; --seq-3: #3987e5; --seq-4: #6da7ec; --seq-5: #b7d3f6;
  --div-neg2: #e66767; --div-neg1: #8a3d3a; --div-mid: #383d3b; --div-pos1: #1c5cab; --div-pos2: #6da7ec;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px -12px rgba(0, 0, 0, .6);
  color-scheme: dark;
}

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 14px/1.55 var(--f-body); -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
h1, h2, h3, h4 { font-family: var(--f-display); color: var(--ink); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: var(--f-mono); font-size: .92em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }
.eyebrow { font: 600 11px/1 var(--f-body); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.grow { flex: 1; min-width: 0; }
svg.i { width: 16px; height: 16px; flex: none; vertical-align: -3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* buttons */
.btn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); padding: 7px 12px; border-radius: var(--r-sm); cursor: pointer; font-weight: 500; font-size: 13px; line-height: 1.2; white-space: nowrap; transition: background .12s, border-color .12s, color .12s; }
.btn:hover { background: var(--surface-2); border-color: var(--muted); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn.sm { padding: 5px 9px; font-size: 12px; }
.btn.lg { padding: 11px 18px; font-size: 15px; border-radius: 9px; }
.btn svg { width: 15px; height: 15px; flex: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; color: var(--ink-2); cursor: pointer; text-align: left; transition: border-color .12s, color .12s, background .12s; }
.chip:hover { border-color: var(--accent); color: var(--ink); background: var(--accent-soft); }
.chip.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.pill { display: inline-flex; align-items: center; gap: 5px; font: 600 10.5px/1 var(--f-body); letter-spacing: .05em; text-transform: uppercase; padding: 4px 7px; border-radius: 5px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill.t-number { background: color-mix(in srgb, var(--s1) 14%, transparent); color: var(--s1); }
.pill.t-category { background: color-mix(in srgb, var(--s7) 14%, transparent); color: var(--s7); }
.pill.t-date { background: color-mix(in srgb, var(--s3) 16%, transparent); color: var(--s3); }
.pill.t-text { background: color-mix(in srgb, var(--s2) 14%, transparent); color: var(--s2); }
.pill.t-id { background: var(--surface-3); color: var(--muted); }
.sev { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; }
.sev::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: currentColor; }
.sev.critical { color: var(--crit); } .sev.warning { color: var(--warn); } .sev.info { color: var(--muted); } .sev.good { color: var(--good); }
.kind { font: 600 10.5px/1 var(--f-body); letter-spacing: .06em; text-transform: uppercase; padding: 4px 7px; border-radius: 5px; border: 1px solid var(--line); color: var(--ink-2); }
.kind.Trend { color: var(--s1); border-color: color-mix(in srgb, var(--s1) 35%, transparent); }
.kind.Anomaly { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 35%, transparent); }
.kind.Segment { color: var(--s7); border-color: color-mix(in srgb, var(--s7) 35%, transparent); }
.kind.Relationship { color: var(--s3); border-color: color-mix(in srgb, var(--s3) 40%, transparent); }
.kind.Quality { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
.kind.Survey { color: var(--s2); border-color: color-mix(in srgb, var(--s2) 40%, transparent); }
.conf { font-size: 11.5px; color: var(--muted); }
.conf b { color: var(--ink-2); font-weight: 600; }

/* form */
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > span { font-size: 12px; font-weight: 500; color: var(--ink-2); }
.input, select.input, textarea.input { width: 100%; border: 1px solid var(--line-2); background: var(--surface); border-radius: var(--r-sm); padding: 7px 10px; font-size: 13px; min-width: 0; }
select.input { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 15px) 55%, calc(100% - 10px) 55%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 28px; }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.check { display: inline-flex; gap: 7px; align-items: center; font-size: 13px; color: var(--ink-2); cursor: pointer; }
.check input { accent-color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; padding: 2px; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 500; color: var(--ink-2); cursor: pointer; }
.seg button.on { background: var(--ink); color: var(--surface); }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; display: flex; align-items: center; gap: 14px; padding: 10px 20px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.brand { display: inline-flex; align-items: center; gap: 9px; font: 700 16px/1 var(--f-display); letter-spacing: -.02em; color: var(--ink); text-decoration: none; background: none; border: 0; cursor: pointer; padding: 0; white-space: nowrap; }
.brand svg { width: 26px; height: 26px; }
.top .search { flex: 1; max-width: 420px; display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; color: var(--muted); cursor: pointer; font-size: 13px; }
.top .search kbd { margin-left: auto; font: 500 11px var(--f-mono); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; color: var(--muted); }
.top .spacer { flex: 1; }

/* landing */
.land { max-width: 1180px; margin: 0 auto; padding: 44px 24px 60px; }
.hero { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 44px; align-items: start; }
.hero h1 { font-size: clamp(38px, 5.6vw, 64px); line-height: .98; font-weight: 700; letter-spacing: -.035em; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero .lede { font-size: 17px; color: var(--ink-2); max-width: 34em; margin-top: 16px; }
.drop { display: block; cursor: pointer; margin-top: 26px; border: 1.5px dashed var(--line-2); border-radius: 14px; background: var(--surface); padding: 28px 22px; text-align: center; transition: border-color .15s, background .15s; position: relative; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop h3 { font-size: 20px; }
.drop .formats { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; margin: 12px 0 16px; }
.drop .formats span { font: 500 11px/1 var(--f-mono); padding: 4px 6px; border-radius: 4px; background: var(--surface-2); color: var(--ink-2); }
.drop input[type=file] { display: none; }
.samples { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
.sample { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 12px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; transition: border-color .12s, transform .12s; }
.sample:hover { border-color: var(--accent); transform: translateY(-1px); }
.sample .kind { align-self: flex-start; }
.sample b { font-size: 13.5px; font-weight: 600; }
.sample small { color: var(--muted); font-size: 12px; }
.privacy { margin-top: 14px; font-size: 12.5px; color: var(--muted); display: flex; gap: 7px; align-items: flex-start; }
.privacy svg { width: 15px; height: 15px; flex: none; margin-top: 2px; }
.preview { border: 1px solid var(--line); border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); overflow: hidden; }
.preview .bar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--surface-2); font-size: 12.5px; }
.preview .bar .dots { display: flex; gap: 5px; } .preview .bar .dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--line-2); }
.preview .body { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.mini-kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.mini-kpis div { border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; }
.mini-kpis small { display: block; font-size: 11px; color: var(--muted); }
.mini-kpis b { font: 600 19px/1.2 var(--f-display); font-variant-numeric: tabular-nums; }
.mini-kpis em { margin-left: 6px; font-style: normal; font-size: 11.5px; font-weight: 600; color: var(--good); }
.noticed { display: flex; flex-direction: column; gap: 8px; }
.noticed li { list-style: none; display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; padding: 9px 10px; border-radius: 8px; background: var(--surface-2); font-size: 13px; }
.noticed ul { padding: 0; margin: 0; display: flex; flex-direction: column; gap: 7px; }
.ai-bubble { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; padding: 10px 12px; border: 1px solid var(--accent-soft); background: color-mix(in srgb, var(--accent-soft) 55%, var(--surface)); border-radius: 10px; color: var(--ink); }
.ai-bubble svg { width: 16px; height: 16px; color: var(--accent); flex: none; margin-top: 2px; }
.steps { margin-top: 56px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border-top: 1px solid var(--line); }
.steps div { padding: 16px 14px 0 0; }
.steps b { display: block; font: 600 15px var(--f-display); margin: 6px 0 4px; }
.steps small { color: var(--muted); font-size: 12.5px; line-height: 1.45; display: block; }
.steps .n { font: 500 11px var(--f-mono); color: var(--accent); }
.caps { margin-top: 48px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.cap { border: 1px solid var(--line); border-radius: 12px; padding: 18px; background: var(--surface); }
.cap h3 { font-size: 17px; margin-bottom: 10px; }
.cap ul { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: 13.5px; display: flex; flex-direction: column; gap: 4px; }
.foot { margin-top: 44px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12.5px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

/* workspace */
.ws { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: calc(100% - 53px); }
.side { border-right: 1px solid var(--line); padding: 16px 12px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: 53px; height: calc(100vh - 53px); overflow-y: auto; background: var(--bg); }
.side .group { display: flex; flex-direction: column; gap: 2px; }
.side .group > .eyebrow { padding: 0 8px 6px; }
.nav { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 7px; color: var(--ink-2); cursor: pointer; border: 0; background: none; width: 100%; text-align: left; font-size: 13.5px; font-weight: 500; }
.nav svg { width: 16px; height: 16px; flex: none; opacity: .85; }
.nav:hover { background: var(--surface-2); color: var(--ink); }
.nav.on { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.nav.on svg { color: var(--accent); opacity: 1; }
.nav .count { margin-left: auto; font: 500 11px var(--f-mono); color: var(--muted); }
.dsitem { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 7px; cursor: pointer; border: 0; background: none; width: 100%; text-align: left; font-size: 13px; color: var(--ink-2); }
.dsitem .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.dsitem.on { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.dsitem:hover { background: var(--surface-2); }
.dsitem svg { width: 15px; height: 15px; flex: none; color: var(--muted); }
.meter { padding: 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); font-size: 12px; color: var(--ink-2); }
.meter .track { height: 6px; background: var(--surface-3); border-radius: 3px; margin: 7px 0 6px; overflow: hidden; }
.meter .track i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.main { min-width: 0; padding: 22px 28px 120px; }
.phead { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.phead h2 { font-size: 26px; font-weight: 650; }
.phead .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.card > h3 { font-size: 15.5px; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.card > h3 .right { margin-left: auto; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; }
.grid2e { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.gap { height: 16px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.kpi small { font-size: 12px; color: var(--muted); text-transform: capitalize; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kpi b { font: 650 27px/1.15 var(--f-display); letter-spacing: -.02em; }
.kpi .delta { font-size: 12px; font-weight: 600; }
.kpi .delta.up { color: var(--good); } .kpi .delta.down { color: var(--crit); }
.kpi svg.spark { width: 100%; height: 30px; margin-top: 6px; }
.hbar { height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; margin-top: 8px; }
.hbar i { display: block; height: 100%; border-radius: 3px; }
.health-rows { display: flex; flex-direction: column; gap: 9px; margin-bottom: 14px; }
.health-rows div { display: grid; grid-template-columns: 100px 1fr 34px; gap: 10px; align-items: center; font-size: 12.5px; color: var(--ink-2); }
.health-rows .hbar { margin: 0; }
.issues { display: flex; flex-direction: column; }
.issue { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.issue:first-child { border-top: 0; }
.issue .t { font-size: 13.5px; font-weight: 500; }
.issue .d { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.list-insights { display: flex; flex-direction: column; gap: 2px; }
.li-ins { display: grid; grid-template-columns: 100px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 8px; border-radius: 8px; cursor: pointer; border: 0; background: none; text-align: left; width: 100%; }
.li-ins:hover { background: var(--surface-2); }
.li-ins .t { font-weight: 500; font-size: 14px; }
.li-ins .k { justify-self: start; }
.qchips { display: flex; flex-wrap: wrap; gap: 7px; }

/* tables */
.tbl-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 8px; max-height: 460px; }
table.tbl { border-collapse: collapse; width: 100%; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; max-width: 280px; overflow: hidden; text-overflow: ellipsis; }
.tbl th { position: sticky; top: 0; background: var(--surface-2); font-weight: 600; color: var(--ink-2); z-index: 1; }
.tbl td.n, .tbl th.n { text-align: right; }
.tbl tr:last-child td { border-bottom: 0; }

svg.hist { width: 110px; height: 26px; display: block; }
.topvals { color: var(--ink-2); max-width: 300px; overflow: hidden; text-overflow: ellipsis; }

/* discover */

.ins .foot2 { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; padding-top: 4px; }
.plot { width: 100%; height: 340px; }
.plot.sm { height: 260px; } .plot.lg { height: 460px; }
.evidence { font-size: 12.5px; color: var(--ink-2); padding-left: 18px; margin: 0; display: flex; flex-direction: column; gap: 3px; }
details.more > summary { cursor: pointer; font-size: 12.5px; font-weight: 500; color: var(--ink-2); list-style: none; display: inline-flex; gap: 6px; align-items: center; }

details.more > summary::before { content: "▸"; font-size: 10px; transition: transform .15s; }
details.more[open] > summary::before { transform: rotate(90deg); }
details.more > div { margin-top: 10px; }
.code { position: relative; }
.code pre { margin: 0; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; overflow: auto; font: 12px/1.55 var(--f-mono); color: var(--ink); max-height: 320px; white-space: pre; }
.code .tabs { display: flex; gap: 4px; margin-bottom: 6px; align-items: center; }
.code .tabs button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 3px 9px; font: 500 11.5px var(--f-mono); cursor: pointer; color: var(--ink-2); }
.code .tabs button.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }

/* result block */
.block { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.block .bh { display: flex; align-items: flex-start; gap: 10px; }
.block .bh h3 { font-size: 16.5px; font-weight: 600; flex: 1; min-width: 0; }
.block .sum { color: var(--ink); font-size: 14px; max-width: 78ch; }
.stats { display: flex; flex-wrap: wrap; gap: 8px; }
.stat { border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px; min-width: 88px; }
.stat small { display: block; font-size: 11px; color: var(--muted); }
.stat b { font: 600 16px/1.3 var(--f-display); font-variant-numeric: tabular-nums; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; }
.explain-out { border-left: 3px solid var(--accent); padding: 8px 12px; background: var(--surface-2); border-radius: 0 8px 8px 0; font-size: 13.5px; white-space: pre-wrap; }

/* clean */
.clean-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.fix-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); align-items: center; }
.fix-row:first-child { border-top: 0; }
.fix-row .t { font-weight: 500; font-size: 13.5px; }
.fix-row .d { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.tool-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; align-items: end; }
.lineage { display: flex; flex-direction: column; position: relative; }
.lin { position: relative; padding: 0 0 14px 22px; }
.lin::before { content: ""; position: absolute; left: 6px; top: 16px; bottom: -2px; width: 1.5px; background: var(--line-2); }
.lin:last-child::before { display: none; }
.lin::after { content: ""; position: absolute; left: 1px; top: 5px; width: 11px; height: 11px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); }

.lin .t { font-size: 13px; font-weight: 500; }
.lin .d { font-size: 12px; color: var(--muted); }
.lin .err { color: var(--crit); font-size: 12px; }
.preview-box { border: 1px solid var(--accent); background: color-mix(in srgb, var(--accent-soft) 45%, var(--surface)); border-radius: 9px; padding: 12px; font-size: 13px; display: flex; flex-direction: column; gap: 10px; }

.catalog { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }

.cat-item.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.cat-item b { font-size: 13.5px; font-weight: 600; }
.cat-item small { color: var(--muted); font-size: 12px; line-height: 1.4; }
.cat-item .g { font: 600 10px var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.packages { display: flex; gap: 8px; flex-wrap: wrap; }
.pkg { display: flex; flex-direction: column; gap: 2px; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 10px 13px; cursor: pointer; min-width: 170px; flex: 1; }

.pkg b { font-size: 13.5px; } .pkg small { color: var(--muted); font-size: 12px; }
.results { display: flex; flex-direction: column; gap: 14px; }
.multi { display: flex; flex-wrap: wrap; gap: 5px; max-height: 120px; overflow: auto; padding: 6px; border: 1px solid var(--line-2); border-radius: var(--r-sm); background: var(--surface); }
.multi label { font-size: 12px; display: inline-flex; gap: 4px; align-items: center; border: 1px solid var(--line); border-radius: 5px; padding: 2px 7px; cursor: pointer; }

.warn.info { background: var(--surface-2); }
.warn .actions { margin-top: 6px; }
.types { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; }
.types button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 4px; font-size: 11.5px; cursor: pointer; color: var(--ink-2); display: flex; flex-direction: column; align-items: center; gap: 3px; }
.types button svg { width: 18px; height: 18px; }
.types button.on { border-color: var(--accent); color: var(--ink); background: var(--accent-soft); }
.describe-box { display: flex; gap: 6px; }

/* ask */
.chat { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.msg-q { align-self: flex-end; background: var(--ink); color: var(--surface); padding: 10px 14px; border-radius: 14px 14px 4px 14px; max-width: 80%; font-size: 14px; }
.msg-a { display: flex; flex-direction: column; gap: 12px; }
.msg-a .answer { font-size: 15px; line-height: 1.6; max-width: 76ch; }
.engine { font-size: 11.5px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.engine i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); display: inline-block; }
.thinking { display: flex; gap: 10px; align-items: center; color: var(--ink-2); font-size: 13.5px; }
.pulse { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: .35; transform: scale(.8); } 50% { opacity: 1; transform: scale(1); } }
.askbar { position: fixed; left: 232px; right: 0; bottom: 0; padding: 12px 28px calc(14px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--bg) 70%, transparent); z-index: 20; }
.askbar form { max-width: 900px; margin: 0 auto; display: flex; gap: 8px; align-items: center; border: 1px solid var(--line-2); background: var(--surface); border-radius: 12px; padding: 6px 6px 6px 14px; box-shadow: var(--shadow); }
.askbar input { flex: 1; border: 0; background: transparent; font-size: 14.5px; padding: 6px 0; min-width: 0; }
.askbar input:focus { outline: none; }
.askbar form:focus-within { border-color: var(--accent); }
.starters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.starters .chip { border-radius: 10px; padding: 10px 12px; }

/* dashboard & report */
.dash { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.dash .card.wide { grid-column: 1 / -1; }
.report { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 18px; align-items: start; }
.paper { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 36px 40px; box-shadow: var(--shadow); min-width: 0; }
.paper h1 { font-size: 30px; font-weight: 700; letter-spacing: -.02em; }
.paper .byline { color: var(--muted); font-size: 12.5px; margin: 6px 0 22px; }
.paper h2 { font-size: 19px; margin: 26px 0 8px; }
.paper .ritem { position: relative; padding: 14px 0; border-top: 1px solid var(--line); }
.paper .ritem .tools { position: absolute; top: 12px; right: 0; display: flex; gap: 2px; opacity: 0; transition: opacity .15s; }
.paper .ritem:hover .tools, .paper .ritem:focus-within .tools { opacity: 1; }
.paper .exec { font-size: 15px; line-height: 1.65; white-space: pre-wrap; }
.paper textarea.input { min-height: 90px; }
.rside { display: flex; flex-direction: column; gap: 12px; position: sticky; top: 70px; }

.progress { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px 26px; width: min(440px, 100%); box-shadow: var(--shadow); }
.progress h3 { font-size: 18px; margin-bottom: 14px; }
.progress ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
.progress li { display: flex; gap: 10px; align-items: center; color: var(--muted); }
.progress li.done { color: var(--ink); } .progress li.now { color: var(--ink); font-weight: 500; }
.progress li .ic { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--line-2); display: grid; place-items: center; flex: none; }
.progress li.done .ic { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.progress li.now .ic { border-color: var(--accent); }
.progress li.now .ic::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1s infinite; }
.palette { position: fixed; inset: 0; z-index: 70; background: color-mix(in srgb, var(--bg) 60%, transparent); backdrop-filter: blur(4px); display: flex; justify-content: center; align-items: flex-start; padding: 12vh 16px 16px; }
.palette .box { width: min(600px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
.palette input { width: 100%; border: 0; border-bottom: 1px solid var(--line); padding: 14px 16px; font-size: 15px; background: transparent; }
.palette input:focus { outline: none; }
.palette ul { list-style: none; margin: 0; padding: 6px; max-height: 50vh; overflow: auto; }
.palette li button { width: 100%; text-align: left; border: 0; background: none; padding: 9px 10px; border-radius: 7px; cursor: pointer; display: flex; gap: 10px; align-items: center; font-size: 13.5px; }
.palette li button small { margin-left: auto; color: var(--muted); font-size: 11.5px; }
.palette li button.sel, .palette li button:hover { background: var(--accent-soft); }
.toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 9px 16px; border-radius: 9px; font-size: 13px; z-index: 80; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.toast.err { background: var(--crit); color: #fff; }

/* text documents */
.doc-text { white-space: pre-wrap; font-size: 13.5px; line-height: 1.7; max-height: 420px; overflow: auto; color: var(--ink-2); background: var(--surface-2); border-radius: 8px; padding: 14px; }
.keysent { border-left: 3px solid var(--accent); padding: 4px 0 4px 12px; font-size: 13.5px; color: var(--ink); }

@media (max-width: 1100px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }

}

  .ws { grid-template-columns: minmax(0, 1fr); }

  .side .group { flex-direction: row; gap: 4px; }

  .nav { width: auto; white-space: nowrap; }
  .nav .count { display: none; }
  .main { padding: 16px 16px 120px; }
  .askbar { left: 0; padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px)); }
  .insights, .dash, .grid2e, .starters { grid-template-columns: minmax(0, 1fr); }
  .top .search span, .top .search kbd { display: none; }
  .top .search { flex: 0 0 auto; }
  .li-ins { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .paper { padding: 22px 18px; }
}
@media (max-width: 520px) {

  .kpis { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }

  .top { padding: 8px 12px; gap: 8px; }
  .top .modeseg { display: none; }
  .land { padding: 28px 16px 40px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* Explain Your Data — core engine: parsing, typing, dataset model, transformations, aggregation, codegen */
(function () {
  const E = (window.EYD = window.EYD || {});

  E.uid = () => Math.random().toString(36).slice(2, 10);

      if (unit === '%') return s + '%';
      return s;
    },
    pct(v, dp = 1) {
      if (!E.isNum(v)) return '—';
      return (v * 100).toFixed(dp) + '%';
    },
    signedPct(v, dp = 1) {
      if (!E.isNum(v)) return '—';
      return (v >= 0 ? '+' : '') + (v * 100).toFixed(dp) + '%';
    },
    p(p) {
      if (!E.isNum(p)) return '—';
      if (p < 0.001) return 'p < 0.001';
      return 'p = ' + p.toFixed(3);

    },
    bytes(b) {
      if (b >= 1048576) return (b / 1048576).toFixed(1) + ' MB';
      if (b >= 1024) return (b / 1024).toFixed(0) + ' KB';
      return b + ' B';

    if (v == null || (typeof v === 'number' && !isFinite(v))) return '';
    if (col && col.type === 'date') return E.fmt.date(v, col.hasTime ? 'datetime' : 'day');
    if (col && col.type === 'number') return E.fmt.num(v, Number.isInteger(v) ? 0 : 2);

  };

  /* ---------- value parsing ---------- */
  const MISSING = new Set(['', 'na', 'n/a', 'null', 'none', '-', '—', '?', 'nan', '#n/a', 'nil', 'missing', 'undefined', '#value!', '#div/0!']);
  E.isMissingToken = (v) => v == null || (typeof v === 'string' && MISSING.has(v.trim().toLowerCase())) || (typeof v === 'number' && isNaN(v));

  E.parseNum = function (s) {
    if (typeof s === 'number') return isFinite(s) ? s : NaN;
    if (typeof s === 'boolean') return NaN;
    if (s == null) return null;
    let t = String(s).trim();
    if (!t) return null;
    let neg = false;

    t = t.replace(/^(AUD|USD|EUR|GBP|BDT|INR|NZD|CAD)\s*/i, '').replace(/\s*(AUD|USD|EUR|GBP|BDT|INR|NZD|CAD)$/i, '');
    t = t.replace(/^[-+]?[$€£¥₹৳]/, (m) => (m[0] === '-' ? '-' : ''));
    t = t.replace(/[$€£¥₹৳]$/, '');
    if (/%$/.test(t)) t = t.slice(0, -1);
    t = t.replace(/[\s\u00a0]/g, '');
    if (/^[-+]?\d{1,3}(,\d{3})+(\.\d+)?$/.test(t)) t = t.replace(/,/g, '');

    let v = parseFloat(t);
    return neg ? -v : v;
  };

  const MON = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, sept: 8, oct: 9, nov: 10, dec: 11 };
  function monIdx(s) {
    const k = String(s).toLowerCase().slice(0, 4);
    if (k in MON) return MON[k];
    const k3 = k.slice(0, 3);
    return k3 in MON ? MON[k3] : -1;
  }
  function mk(y, mo, d, h, mi, s, ampm) {

    if (s instanceof Date) return isNaN(s) ? NaN : Date.UTC(s.getFullYear(), s.getMonth(), s.getDate(), s.getHours(), s.getMinutes(), s.getSeconds());

    t = t.replace(/\s*(GMT|UTC)\s*[+-]?\d{0,2}(:?\d{2})?$/i, '').replace(/Z$/, '').replace(/([+-]\d{2}:?\d{2})$/, (m) => (/\dT\d/.test(t) ? '' : m));

    const time = '(?:[ T,]+(\\d{1,2}):(\\d{2})(?::(\\d{2})(?:\\.\\d+)?)?\\s*(AM|PM|am|pm)?)?';
    if ((m = t.match(new RegExp('^(\\d{4})[-/.](\\d{1,2})[-/.](\\d{1,2})' + time + '$')))) return mk(+m[1], +m[2] - 1, +m[3], m[4], m[5], m[6], m[7]);
    if ((m = t.match(new RegExp('^(\\d{1,2})[-/.](\\d{1,2})[-/.](\\d{2}|\\d{4})' + time + '$')))) {

      if (a > 12) { d = a; mo = b; } else if (b > 12) { d = b; mo = a; } else if (order === 'mdy') { mo = a; d = b; } else { d = a; mo = b; }

  /* Likert & ordinal scales */
  const SCALES = [
    ['strongly disagree', 'disagree', 'neutral', 'agree', 'strongly agree'],
    ['strongly disagree', 'disagree', 'neither agree nor disagree', 'agree', 'strongly agree'],
    ['strongly disagree', 'somewhat disagree', 'neither agree nor disagree', 'somewhat agree', 'strongly agree'],
    ['very dissatisfied', 'dissatisfied', 'neutral', 'satisfied', 'very satisfied'],
    ['very unsatisfied', 'unsatisfied', 'neutral', 'satisfied', 'very satisfied'],
    ['never', 'rarely', 'sometimes', 'often', 'always'],
    ['very poor', 'poor', 'fair', 'good', 'excellent'],
    ['poor', 'fair', 'good', 'very good', 'excellent'],
    ['not at all likely', 'unlikely', 'neutral', 'likely', 'very likely'],
    ['very unlikely', 'unlikely', 'neutral', 'likely', 'very likely'],
    ['low', 'medium', 'high'],
    ['very low', 'low', 'medium', 'high', 'very high'],
    ['1st year', '2nd year', '3rd year', '4th year', 'postgraduate'],
  ];
  function detectScale(distinctLower) {
    for (const sc of SCALES) {
      if (distinctLower.length >= 2 && distinctLower.every((v) => sc.includes(v))) return sc;
    }
    return null;
  }

  /* ---------- column inference ---------- */
  const ID_NAME = /(^id$|_id$|^id_|\bid\b|uuid|guid|^code$|postcode|zip|phone|email|^key$|order.?(no|number|id)|invoice|record)/i;
  const DATE_NAME = /(date|time|timestamp|created|updated|month|day|period|week)/i;

  E.inferColumn = function (name, raw) {
    const n = raw.length;
    const vals = new Array(n);
    let ne = 0;
    const nonEmptyIdx = [];
    for (let i = 0; i < n; i++) {
      const v = raw[i];
      if (E.isMissingToken(v)) vals[i] = null;
      else { vals[i] = typeof v === 'string' ? v.trim() : v; ne++; nonEmptyIdx.push(i); }
    }
    const col = { name: String(name), type: 'category', values: vals, invalid: 0, invalidExamples: [] };
    if (ne === 0) { col.type = 'category'; col.empty = true; return col; }

    const sampleIdx = nonEmptyIdx.length > 3000 ? nonEmptyIdx.filter((_, k) => k % Math.ceil(nonEmptyIdx.length / 3000) === 0) : nonEmptyIdx;
    let numOk = 0, dateOk = 0, allJsNum = true, anyDateObj = false, dmyVotes = 0, mdyVotes = 0, hasTime = false, curr = 0, pct = 0;
    for (const i of sampleIdx) {
      const v = vals[i];
      if (typeof v !== 'number') allJsNum = false;
      if (v instanceof Date) anyDateObj = true;
      const pn = E.parseNum(v);
      if (E.isNum(pn)) numOk++;
      if (typeof v === 'string') {
        if (/^[-(]?[$€£¥₹৳]/.test(v)) curr++;
        if (/%$/.test(v)) pct++;
        const m = v.match(/^(\d{1,2})[-/.](\d{1,2})[-/.]\d{2,4}/);
        if (m) { if (+m[1] > 12) dmyVotes++; if (+m[2] > 12) mdyVotes++; }

      }
      if (v instanceof Date && (v.getHours() || v.getMinutes())) hasTime = true;
      if (typeof v !== 'number' && E.isNum(E.parseDate(v, 'dmy'))) dateOk++;
    }
    const sn = sampleIdx.length;
    const order = mdyVotes > dmyVotes ? 'mdy' : 'dmy';

    if ((numOk / sn >= 0.9 || allJsNum) && !(DATE_NAME.test(name) && dateOk / sn > 0.5)) {
      col.type = 'number';
      if (curr / sn > 0.3 || /(revenue|sales|price|cost|amount|profit|income|spend|salary|\$|aud|usd|fee|value_aud|budget)/i.test(name)) col.unit = '$';
      else if (pct / sn > 0.3 || /(percent|pct|rate_%|%)/i.test(name)) col.unit = '%';
      for (let i = 0; i < n; i++) {
        if (vals[i] == null) continue;
        const pn = E.parseNum(vals[i]);
        if (E.isNum(pn)) vals[i] = pn;
        else { col.invalid++; if (col.invalidExamples.length < 5) col.invalidExamples.push(String(vals[i])); vals[i] = null; }
      }
      // identifiers disguised as numbers
      if (ID_NAME.test(name)) {
        const uniq = new Set(vals.filter((v) => v != null)).size;
        if (uniq / ne > 0.9) col.type = 'id';
      }
      return col;
    }
    if (anyDateObj || dateOk / sn >= 0.85) {
      col.type = 'date';
      col.dateOrder = order;
      col.hasTime = hasTime;
      for (let i = 0; i < n; i++) {
        if (vals[i] == null) continue;
        const d = E.parseDate(vals[i], order);
        if (E.isNum(d)) vals[i] = d;
        else { col.invalid++; if (col.invalidExamples.length < 5) col.invalidExamples.push(String(vals[i])); vals[i] = null; }
      }
      return col;
    }
    // strings
    for (let i = 0; i < n; i++) if (vals[i] != null && typeof vals[i] !== 'string') vals[i] = String(vals[i]);
    const counts = new Map();
    let totalLen = 0, wordy = 0;
    for (const i of nonEmptyIdx) {
      const v = vals[i];
      counts.set(v, (counts.get(v) || 0) + 1);
      totalLen += v.length;
      if (v.split(/\s+/).length > 6) wordy++;
    }
    const uniq = counts.size, avgLen = totalLen / ne;
    const distinctLower = [...new Set([...counts.keys()].map((v) => v.toLowerCase().replace(/\s+/g, ' ').trim()))];
    const scale = uniq <= 12 ? detectScale(distinctLower) : null;
    if (scale) {
      col.type = 'category';
      col.ordinal = true;
      col.order = scale.map((s) => { const hit = [...counts.keys()].find((k) => k.toLowerCase().trim() === s); return hit || null; }).filter(Boolean);
      col.likert = scale.length === 5 && !/year|postgraduate/.test(scale.join(' '));

    }
    if (ID_NAME.test(name) && uniq / ne > 0.9) { col.type = 'id'; return col; }
    if (uniq <= Math.max(25, ne * 0.02) || (uniq / ne < 0.5 && avgLen < 30)) { col.type = 'category'; return col; }
    if (avgLen > 35 || wordy / ne > 0.3) { col.type = 'text'; return col; }
    if (uniq / ne > 0.9) { col.type = 'id'; return col; }
    col.type = 'category';
    return col;
  };

  /* ---------- dataset model ---------- */
  function cloneCols(cols) {
    return cols.map((c) => Object.assign({}, c, { values: c.values.slice(), order: c.order ? c.order.slice() : undefined, invalidExamples: (c.invalidExamples || []).slice() }));
  }
  E.cloneCols = cloneCols;

  E.makeDataset = function ({ name, file, sheet, headers, rows, source }) {
    // rows: array of arrays aligned to headers
    const seen = {};
    const cleanHeaders = headers.map((h, i) => {
      let s = h == null || String(h).trim() === '' ? 'column_' + (i + 1) : String(h).trim();
      if (seen[s]) { seen[s]++; s = s + '_' + seen[s]; } else seen[s] = 1;

    const unnamed = headers.filter((h) => h == null || String(h).trim() === '').length;

    rows = rows.filter((r) => r && r.some((v) => !E.isMissingToken(v)));
    const cols = cleanHeaders.map((h, j) => E.inferColumn(h, rows.map((r) => r[j])));
    const ds = {
      id: E.uid(), kind: 'table', name: name || file || 'dataset', file, sheet, source: source || file,
      original: cloneCols(cols), cols, n: rows.length, steps: [], redo: [], rev: 0, unnamedHeaders: unnamed, createdAt: Date.now(),
    };
    return ds;
  };

  E.makeTextDoc = function ({ name, file, text, source, tables }) {
    return { id: E.uid(), kind: 'text', name: name || file, file, source: source || file, text: text || '', tables: tables || [], rev: 0, createdAt: Date.now() };
  };

  E.col = (ds, name) => ds.cols.find((c) => c.name === name);
  E.colsOf = (ds, types) => ds.cols.filter((c) => types.includes(c.type));

  E.rowObj = function (ds, i) {
    const o = {};
    for (const c of ds.cols) o[c.name] = c.values[i];
    return o;
  };

  E.keepRows = function (ds, mask) {
    for (const c of ds.cols) c.values = c.values.filter((_, i) => mask[i]);
    ds.n = ds.cols.length ? ds.cols[0].values.length : 0;
  };

  /* ---------- transformations (each returns {label, py, r}) ---------- */
  const numericVals = (c) => c.values.filter(E.isNum);

  const OPS = {
    fill_missing(ds, p) {

        median: `df[${col}] = df[${col}].fillna(df[${col}].median())`,
        mode: `df[${col}] = df[${col}].fillna(df[${col}].mode()[0])`,
        ffill: `df[${col}] = df[${col}].ffill()`,
        bfill: `df[${col}] = df[${col}].bfill()`,
        interpolate: `df[${col}] = df[${col}].interpolate()`,
        value: `df[${col}] = df[${col}].fillna(${E.pyStr(p.value)})`,
      }[p.method];

        mean: `df <- df %>% mutate(${rc} = replace_na(${rc}, mean(${rc}, na.rm = TRUE)))`,
        median: `df <- df %>% mutate(${rc} = replace_na(${rc}, median(${rc}, na.rm = TRUE)))`,
        mode: `df <- df %>% mutate(${rc} = replace_na(${rc}, names(which.max(table(${rc})))))`,

        bfill: `df <- df %>% fill(${rc}, .direction = "up")`,

    },
    drop_missing(ds, p) {

    },

    convert_type(ds, p) {

      } else if (p.to === 'date') {

    },
    text_clean(ds, p) {
      const c = E.col(ds, p.col); if (!c) throw new Error('Column not found');

      const f = {
        trim: (s) => s.trim().replace(/\s+/g, ' '),
        lower: (s) => s.toLowerCase(),
        upper: (s) => s.toUpperCase(),
        title: (s) => titleCase(s),
        remove_special: (s) => s.replace(/[^\p{L}\p{N}\s.\-]/gu, ''),

        const a = ql(0.25), z = ql(0.75), k = p.k || 3; lo = Math.exp(a - k * (z - a)); hi = Math.exp(z + k * (z - a));
      } else {
        const q = (pp) => { const pos = (nums.length - 1) * pp, b = Math.floor(pos); return nums[b] + (nums[Math.min(b + 1, nums.length - 1)] - nums[b]) * (pos - b); };
        const q1 = q(0.25), q3 = q(0.75), iqr = q3 - q1, k = p.k || 1.5; lo = q1 - k * iqr; hi = q3 + k * iqr;
      }
      if (nums.length && nums[0] >= 0 && lo < nums[0]) lo = nums[0]; // non-negative measures never get a negative bound
      const mname = p.method === 'zscore' ? 'z-score' : p.method === 'logiqr' ? 'log-IQR' : 'IQR';
      let count = 0;
      const col = E.pyStr(p.col), rc = E.rName(p.col);
      const bounds = p.method === 'logiqr' ? `lg = np.log(df[${col}].where(df[${col}] > 0))\nq1, q3 = lg.quantile([.25, .75])\nlo, hi = np.exp(q1 - ${p.k || 3}*(q3-q1)), np.exp(q3 + ${p.k || 3}*(q3-q1))` : p.method === 'zscore' ? `m, s = df[${col}].mean(), df[${col}].std()\nlo, hi = m - ${p.k || 3}*s, m + ${p.k || 3}*s` : `q1, q3 = df[${col}].quantile([.25, .75])\nlo, hi = q1 - ${p.k || 1.5}*(q3-q1), q3 + ${p.k || 1.5}*(q3-q1)`;
      const rb = p.method === 'logiqr' ? `lg <- log(ifelse(df$${rc} > 0, df$${rc}, NA)); q <- quantile(lg, c(.25,.75), na.rm=TRUE); lo <- exp(q[1] - ${p.k || 3}*diff(q)); hi <- exp(q[2] + ${p.k || 3}*diff(q))` : p.method === 'zscore' ? `lo <- mean(df$${rc}, na.rm=TRUE) - ${p.k || 3}*sd(df$${rc}, na.rm=TRUE); hi <- mean(df$${rc}, na.rm=TRUE) + ${p.k || 3}*sd(df$${rc}, na.rm=TRUE)` : `q <- quantile(df$${rc}, c(.25,.75), na.rm=TRUE); lo <- q[1] - ${p.k || 1.5}*diff(q); hi <- q[2] + ${p.k || 1.5}*diff(q)`;
      if (p.action === 'cap') {
        c.values = c.values.map((v) => { if (!E.isNum(v)) return v; if (v < lo) { count++; return lo; } if (v > hi) { count++; return hi; } return v; });
        return { label: `Capped ${count} outliers in ${p.col} to [${E.fmt.num(lo)}, ${E.fmt.num(hi)}] (${mname})`, py: `${bounds}\ndf[${col}] = df[${col}].clip(lo, hi)`, r: `${rb}\ndf <- df %>% mutate(${rc} = pmin(pmax(${rc}, lo), hi))` };
      }
      const mask = c.values.map((v) => { const out = E.isNum(v) && (v < lo || v > hi); if (out) count++; return !out; });
      E.keepRows(ds, mask);
      return { label: `Removed ${count} outlier rows in ${p.col} (${mname})`, py: `${bounds}\ndf = df[df[${col}].between(lo, hi) | df[${col}].isna()]`, r: `${rb}\ndf <- df %>% filter(is.na(${rc}) | between(${rc}, lo, hi))` };
    },
    extract_date(ds, p) {
      const c = E.col(ds, p.col); if (!c || c.type !== 'date') throw new Error('Pick a date column');
      const name = p.name || p.col + '_' + p.part;
      const vals = c.values.map((v) => {
        if (!E.isNum(v)) return null; const d = new Date(v);
        switch (p.part) {
          case 'year': return d.getUTCFullYear();
          case 'month': return MONTHS[d.getUTCMonth()];
          case 'quarter': return 'Q' + (Math.floor(d.getUTCMonth() / 3) + 1);
          case 'weekday': return DAYS[d.getUTCDay()];
          case 'hour': return d.getUTCHours();
          case 'yearmonth': return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0');
          case 'week': { const t = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate())); const dn = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - dn); const ys = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - ys) / 864e5 + 1) / 7); }
        }
      });
      const type = ['year', 'hour', 'week'].includes(p.part) ? 'number' : 'category';
      const newCol = { name, type, values: vals, invalid: 0, invalidExamples: [] };
      if (p.part === 'month') { newCol.ordinal = true; newCol.order = MONTHS.slice(); }
      if (p.part === 'weekday') { newCol.ordinal = true; newCol.order = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun']; }
      if (p.part === 'quarter') { newCol.ordinal = true; newCol.order = ['Q1', 'Q2', 'Q3', 'Q4']; }
      const idx = ds.cols.findIndex((x) => x.name === name);
      if (idx >= 0) ds.cols[idx] = newCol; else ds.cols.splice(ds.cols.indexOf(c) + 1, 0, newCol);
      const col = E.pyStr(p.col);
      const pyPart = { year: '.dt.year', month: '.dt.strftime("%b")', quarter: '.dt.quarter.map(lambda q: f"Q{q}")', weekday: '.dt.strftime("%a")', hour: '.dt.hour', yearmonth: '.dt.strftime("%Y-%m")', week: '.dt.isocalendar().week' }[p.part];
      const rPart = { year: 'year', month: 'month(%s, label = TRUE)', quarter: 'paste0("Q", quarter(%s))', weekday: 'wday(%s, label = TRUE)', hour: 'hour', yearmonth: 'format(%s, "%Y-%m")', week: 'isoweek' }[p.part];
      const rc = E.rName(p.col);
      const rExpr = rPart.includes('%s') ? rPart.replace('%s', rc) : `${rPart}(${rc})`;
      return { label: `Extracted ${p.part} from ${p.col} into ${name}`, py: `df[${E.pyStr(name)}] = df[${col}]${pyPart}`, r: `df <- df %>% mutate(${E.rName(name)} = ${rExpr})` };
    },
    rename(ds, p) {
      const c = E.col(ds, p.col); if (!c) throw new Error('Column not found');
      if (E.col(ds, p.to)) throw new Error('A column called ' + p.to + ' already exists');
      c.name = p.to;
      return { label: `Renamed ${p.col} to ${p.to}`, py: `df = df.rename(columns={${E.pyStr(p.col)}: ${E.pyStr(p.to)}})`, r: `df <- df %>% rename(${E.rName(p.to)} = ${E.rName(p.col)})` };
    },
    drop_column(ds, p) {
      ds.cols = ds.cols.filter((c) => c.name !== p.col);
      return { label: `Removed column ${p.col}`, py: `df = df.drop(columns=[${E.pyStr(p.col)}])`, r: `df <- df %>% select(-${E.rName(p.col)})` };
    },
    derive(ds, p) {
      const a = E.col(ds, p.a), b = p.bIsConst ? null : E.col(ds, p.b);
      if (!a) throw new Error('Column not found');
      const bv = (i) => (p.bIsConst ? +p.b : b.values[i]);
      const f = { '+': (x, y) => x + y, '-': (x, y) => x - y, '*': (x, y) => x * y, '/': (x, y) => (y === 0 ? null : x / y) }[p.op];
      const vals = a.values.map((x, i) => { const y = bv(i); return E.isNum(x) && E.isNum(y) ? f(x, y) : null; });
      const newCol = { name: p.name, type: 'number', values: vals, invalid: 0, invalidExamples: [], unit: a.unit === '$' && (p.op === '+' || p.op === '-' || (p.op === '*' && p.bIsConst)) ? '$' : undefined };
      const idx = ds.cols.findIndex((x) => x.name === p.name);
      if (idx >= 0) ds.cols[idx] = newCol; else ds.cols.push(newCol);
      const bpy = p.bIsConst ? p.b : `df[${E.pyStr(p.b)}]`, br = p.bIsConst ? p.b : E.rName(p.b);
      return { label: `Created ${p.name} = ${p.a} ${p.op} ${p.b}`, py: `df[${E.pyStr(p.name)}] = df[${E.pyStr(p.a)}] ${p.op} ${bpy}`, r: `df <- df %>% mutate(${E.rName(p.name)} = ${E.rName(p.a)} ${p.op} ${br})` };
    },
    filter(ds, p) {
      const c = E.col(ds, p.col); if (!c) throw new Error('Column not found');
      const test = E.makeTest(c, p.op, p.value);
      const mask = c.values.map((v) => test(v));
      const before = ds.n;
      E.keepRows(ds, mask);
      const pv = c.type === 'number' ? p.value : E.pyStr(p.value);
      const opPy = { '=': '==', '!=': '!=', '>': '>', '<': '<', '>=': '>=', '<=': '<=' }[p.op];
      const py = p.op === 'contains' ? `df = df[df[${E.pyStr(p.col)}].str.contains(${E.pyStr(p.value)}, case=False, na=False)]` : `df = df[df[${E.pyStr(p.col)}] ${opPy} ${c.type === 'date' ? `pd.Timestamp(${E.pyStr(p.value)})` : pv}]`;
      const r = p.op === 'contains' ? `df <- df %>% filter(str_detect(str_to_lower(${E.rName(p.col)}), ${JSON.stringify(String(p.value).toLowerCase())}))` : `df <- df %>% filter(${E.rName(p.col)} ${opPy} ${c.type === 'date' ? `as.Date(${JSON.stringify(p.value)})` : c.type === 'number' ? p.value : JSON.stringify(p.value)})`;
      return { label: `Kept rows where ${p.col} ${p.op} ${p.value} (${(before - ds.n).toLocaleString()} removed)`, py, r };
    },
    replace_value(ds, p) {
      const c = E.col(ds, p.col); if (!c) throw new Error('Column not found');
      let k = 0;
      c.values = c.values.map((v) => (String(v) === String(p.from) ? (k++, c.type === 'number' ? E.parseNum(p.to) : p.to) : v));
      if (c.order) c.order = c.order.map((o) => (o === p.from ? p.to : o));
      return { label: `Replaced "${p.from}" with "${p.to}" in ${p.col} (${k} values)`, py: `df[${E.pyStr(p.col)}] = df[${E.pyStr(p.col)}].replace(${E.pyStr(p.from)}, ${E.pyStr(p.to)})`, r: `df <- df %>% mutate(${E.rName(p.col)} = replace(${E.rName(p.col)}, ${E.rName(p.col)} == ${JSON.stringify(p.from)}, ${JSON.stringify(p.to)}))` };
    },
    negative_to_missing(ds, p) {
      const c = E.col(ds, p.col); if (!c) throw new Error('Column not found');
      let k = 0;
      c.values = c.values.map((v) => (E.isNum(v) && v < 0 ? (k++, null) : v));
      return { label: `Blanked ${k} impossible negative value${k === 1 ? '' : 's'} in ${p.col}`, py: `df.loc[df[${E.pyStr(p.col)}] < 0, ${E.pyStr(p.col)}] = np.nan`, r: `df <- df %>% mutate(${E.rName(p.col)} = ifelse(${E.rName(p.col)} < 0, NA, ${E.rName(p.col)}))` };
    },
    likert_score(ds, p) {
      const c = E.col(ds, p.col); if (!c || !c.order) throw new Error('Pick an ordered (Likert) column');
      const name = p.name || p.col + ' (score)';
      const map = new Map(c.order.map((o, i) => [o, i + 1]));
      const newCol = { name, type: 'number', values: c.values.map((v) => (v == null ? null : map.get(v) ?? null)), invalid: 0, invalidExamples: [] };
      const idx = ds.cols.findIndex((x) => x.name === name);
      if (idx >= 0) ds.cols[idx] = newCol; else ds.cols.splice(ds.cols.indexOf(c) + 1, 0, newCol);
      const mapping = c.order.map((o, i) => E.pyStr(o) + ': ' + (i + 1)).join(', ');
      return { label: `Scored ${p.col} as 1–${c.order.length} in "${name}"`, py: `df[${E.pyStr(name)}] = df[${E.pyStr(p.col)}].map({${mapping}})`, r: `df <- df %>% mutate(${E.rName(name)} = as.integer(factor(${E.rName(p.col)}, levels = c(${c.order.map((o) => JSON.stringify(o)).join(', ')}))))` };
    },
  };
  E.OPS = OPS;

  E.makeTest = function (c, op, value) {
    let tv = value;
    if (c.type === 'number') tv = E.parseNum(value);
    if (c.type === 'date') tv = E.parseDate(value, 'dmy');
    const lower = String(value).toLowerCase();
    return (v) => {
      if (v == null) return false;
      switch (op) {
        case '=': return c.type === 'number' || c.type === 'date' ? v === tv : String(v).toLowerCase() === lower;
        case '!=': return c.type === 'number' || c.type === 'date' ? v !== tv : String(v).toLowerCase() !== lower;
        case '>': return v > tv;
        case '<': return v < tv;
        case '>=': return v >= tv;
        case '<=': return v <= tv;
        case 'in': return Array.isArray(value) && value.map(String).includes(String(v));
        case 'contains': return String(v).toLowerCase().includes(lower);
        default: return true;
      }
    };
  };

  E.replay = function (ds) {
    ds.cols = cloneCols(ds.original);
    ds.n = ds.cols.length ? ds.cols[0].values.length : 0;
    for (const s of ds.steps) {
      try { const out = OPS[s.op](ds, s.params); Object.assign(s, out); s.error = null; } catch (e) { s.error = e.message; }
    }
    ds.rev++;
    ds._profile = null;
  };

  E.applyStep = function (ds, op, params) {
    const out = OPS[op](ds, params); // throws on error
    ds.steps.push(Object.assign({ id: E.uid(), op, params, at: Date.now() }, out));
    ds.redo = [];
    ds.rev++;
    ds._profile = null;
    return out;
  };
  E.previewStep = function (ds, op, params) {
    const tmp = { cols: cloneCols(ds.cols), n: ds.n };
    const out = OPS[op](tmp, params);
    return { out, tmp };
  };
  E.undo = function (ds) { if (!ds.steps.length) return false; ds.redo.push(ds.steps.pop()); E.replay(ds); return true; };
  E.redo = function (ds) { if (!ds.redo.length) return false; const s = ds.redo.pop(); ds.steps.push(s); E.replay(ds); return true; };
  E.revertTo = function (ds, idx) { ds.redo = ds.steps.slice(idx).reverse().concat(ds.redo); ds.steps = ds.steps.slice(0, idx); E.replay(ds); };

  /* ---------- aggregation ---------- */
  E.bucket = function (ts, grain) {
    const d = new Date(ts);
    const y = d.getUTCFullYear(), m = d.getUTCMonth();
    switch (grain) {
      case 'year': return Date.UTC(y, 0, 1);
      case 'quarter': return Date.UTC(y, Math.floor(m / 3) * 3, 1);
      case 'month': return Date.UTC(y, m, 1);
      case 'week': { const day = (d.getUTCDay() + 6) % 7; return Date.UTC(y, m, d.getUTCDate() - day); }
      default: return Date.UTC(y, m, d.getUTCDate());
    }
  };
  E.autoGrain = function (col) {
    const v = col.values.filter(E.isNum);
    if (!v.length) return 'month';
    let mn = Infinity, mx = -Infinity; for (const x of v) { if (x < mn) mn = x; if (x > mx) mx = x; }
    const days = (mx - mn) / 864e5;
    if (days > 365 * 6) return 'year';
    if (days > 365 * 2.5) return 'quarter';
    if (days > 75) return 'month';
    if (days > 20) return 'week';
    return 'day';
  };

  const AGG = {
    sum: (a) => a.reduce((s, v) => s + v, 0),
    mean: (a) => (a.length ? a.reduce((s, v) => s + v, 0) / a.length : null),
    median: (a) => median(a),
    min: (a) => (a.length ? Math.min(...a) : null),
    max: (a) => (a.length ? Math.max(...a) : null),
    std: (a) => { if (a.length < 2) return null; const m = a.reduce((s, v) => s + v, 0) / a.length; return Math.sqrt(a.reduce((s, v) => s + (v - m) ** 2, 0) / (a.length - 1)); },
  };
  E.AGG_LABEL = { sum: 'Total', mean: 'Average', median: 'Median', min: 'Minimum', max: 'Maximum', count: 'Count', count_distinct: 'Distinct', std: 'Std dev', share: 'Share' };

  /* spec: {by:[col], metrics:[{col, agg}], filters:[{col,op,value}], timeGrain, sort:{by, dir}, limit} */
  E.aggregate = function (ds, spec) {
    const by = (spec.by || []).map((n) => E.col(ds, n)).filter(Boolean);
    const metrics = (spec.metrics && spec.metrics.length ? spec.metrics : [{ col: null, agg: 'count' }]).map((m) => ({ ...m, c: m.col ? E.col(ds, m.col) : null, agg: m.agg || (m.col ? 'sum' : 'count') }));
    const tests = (spec.filters || []).map((f) => { const c = E.col(ds, f.col); return c ? [c, E.makeTest(c, f.op, f.value)] : null; }).filter(Boolean);
    const grain = spec.timeGrain || null;
    const groups = new Map();
    for (let i = 0; i < ds.n; i++) {
      let ok = true;
      for (const [c, t] of tests) if (!t(c.values[i])) { ok = false; break; }
      if (!ok) continue;
      const keyParts = [];
      let skip = false;
      for (const c of by) {
        let v = c.values[i];
        if (v == null) { if (spec.dropNull !== false) { skip = true; break; } v = '(missing)'; }
        if (c.type === 'date') v = E.bucket(v, grain || E.autoGrain(c));
        keyParts.push(v);
      }
      if (skip) continue;
      const key = keyParts.join('\u0001');
      let g = groups.get(key);
      if (!g) { g = { keys: keyParts, vals: metrics.map(() => []), n: 0 }; groups.set(key, g); }
      g.n++;
      metrics.forEach((m, j) => { if (m.c) { const v = m.c.values[i]; if (v != null) g.vals[j].push(v); } });
    }
    const rows = [];
    for (const g of groups.values()) {
      const row = g.keys.slice();
      metrics.forEach((m, j) => {
        const a = g.vals[j];
        if (m.agg === 'count') row.push(m.c ? a.length : g.n);
        else if (m.agg === 'count_distinct') row.push(new Set(a).size);
        else row.push(AGG[m.agg] ? AGG[m.agg](a.filter(E.isNum)) : null);
      });
      rows.push(row);
    }
    const columns = by.map((c) => c.name).concat(metrics.map((m) => (m.c ? (m.agg === 'count' ? 'count' : m.agg + '_' + m.c.name) : 'count')));
    const colTypes = by.map((c) => c.type).concat(metrics.map(() => 'number'));
    // sort
    const k = by.length;
    const byDate = by.length && by[0].type === 'date';
    const ord = by.length && by[0].order ? by[0].order : null;
    if (spec.sort && spec.sort.by != null) {
      const idx = typeof spec.sort.by === 'number' ? spec.sort.by : columns.indexOf(spec.sort.by);
      const dir = spec.sort.dir === 'asc' ? 1 : -1;
      if (idx >= 0) rows.sort((a, b) => ((a[idx] ?? -Infinity) > (b[idx] ?? -Infinity) ? dir : (a[idx] ?? -Infinity) < (b[idx] ?? -Infinity) ? -dir : 0));
    } else if (byDate) rows.sort((a, b) => a[0] - b[0]);
    else if (ord) rows.sort((a, b) => ord.indexOf(a[0]) - ord.indexOf(b[0]));
    else if (by.length && by[0].type === 'number') rows.sort((a, b) => a[0] - b[0]);
    else if (k) rows.sort((a, b) => (b[k] ?? 0) - (a[k] ?? 0));
    const limited = spec.limit ? rows.slice(0, spec.limit) : rows;
    return { columns, colTypes, rows: limited, totalGroups: rows.length, grain: byDate ? grain || E.autoGrain(by[0]) : null, metricsMeta: metrics.map((m) => ({ col: m.col, agg: m.agg, unit: m.c && m.c.unit })) };
  };

  E.aggCode = function (spec) {
    const by = spec.by || [];
    const ms = spec.metrics && spec.metrics.length ? spec.metrics : [{ col: null, agg: 'count' }];
    const fpy = (spec.filters || []).map((f) => `df[${E.pyStr(f.col)}] ${f.op === '=' ? '==' : f.op} ${JSON.stringify(f.value)}`);
    let py = 'd = df' + (fpy.length ? `[${fpy.map((x) => '(' + x + ')').join(' & ')}]` : '') + '\n';
    if (spec.timeGrain && by.length) py += `d = d.assign(**{${E.pyStr(by[0])}: d[${E.pyStr(by[0])}].dt.to_period("${{ day: 'D', week: 'W', month: 'M', quarter: 'Q', year: 'Y' }[spec.timeGrain]}").dt.to_timestamp()})\n`;
    const aggPy = ms.map((m) => (m.col ? `${m.agg === 'count' ? 'count' : m.agg + '_' + m.col}=(${E.pyStr(m.col)}, "${m.agg === 'count_distinct' ? 'nunique' : m.agg}")` : `count=(${E.pyStr(by[0] || df0)}, "size")`)).join(', ');
    py += by.length ? `result = d.groupby([${by.map(E.pyStr).join(', ')}]).agg(${aggPy}).reset_index()` : `result = d.agg(${aggPy})`;
    if (spec.sort) py += `.sort_values(${E.pyStr(spec.sort.by)}, ascending=${spec.sort.dir === 'asc' ? 'True' : 'False'})`;
    if (spec.limit) py += `.head(${spec.limit})`;
    const fr = (spec.filters || []).map((f) => `${E.rName(f.col)} ${f.op === '=' ? '==' : f.op} ${JSON.stringify(f.value)}`);
    let r = 'result <- df' + (fr.length ? ` %>%\n  filter(${fr.join(', ')})` : '');
    if (spec.timeGrain && by.length) r += ` %>%\n  mutate(${E.rName(by[0])} = floor_date(${E.rName(by[0])}, "${spec.timeGrain}"))`;
    if (by.length) r += ` %>%\n  group_by(${by.map(E.rName).join(', ')})`;
    r += ` %>%\n  summarise(${ms.map((m) => (m.col ? `${m.agg === 'count' ? 'count' : m.agg + '_' + m.col.replace(/\W+/g, '_')} = ${{ sum: 'sum', mean: 'mean', median: 'median', min: 'min', max: 'max', std: 'sd', count: 'n', count_distinct: 'n_distinct' }[m.agg]}(${m.agg === 'count' ? '' : E.rName(m.col) + (m.agg === 'count_distinct' ? '' : ', na.rm = TRUE')})` : 'count = n()')).join(', ')}, .groups = "drop")`;
    if (spec.sort) r += ` %>%\n  arrange(${spec.sort.dir === 'asc' ? '' : 'desc('}${(spec.sort.by || 'count').replace(/\W+/g, '_')}${spec.sort.dir === 'asc' ? '' : ')'})`;
    if (spec.limit) r += ` %>%\n  head(${spec.limit})`;
    return { py, r };
  };
  const df0 = 'index';

  /* rows for export */
  E.toMatrix = function (ds, raw) {
    const header = ds.cols.map((c) => c.name);
    const rows = [];
    for (let i = 0; i < ds.n; i++) rows.push(ds.cols.map((c) => { const v = c.values[i]; if (v == null) return ''; if (c.type === 'date') return raw ? new Date(v).toISOString().slice(0, c.hasTime ? 19 : 10).replace('T', ' ') : E.fmtVal(c, v); return v; }));
    return { header, rows };
  };
